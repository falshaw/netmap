<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NetMap: self-hosted network discovery and topology diagrams (nmap, ARP, SNMP), with draw.io, PNG and PDF export." />
    <title>NetMap</title>
    <!-- Sets data-theme before first paint (no light/dark flash). Key matches ThemeToggle.tsx. -->
    <script>
      (function(){try{var s=localStorage.getItem("netmap-theme");var d=s?s==="dark":matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.dataset.theme=d?"dark":"light"}catch(e){document.documentElement.dataset.theme="light"}})();
    </script>
    <link rel="preload" href="/fonts/PlusJakartaSans-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
